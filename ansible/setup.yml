---
- name: Set up ResuMatch host
  hosts: resumatch
  become: true
  vars:
    gitleaks_version: "8.24.2"
    k3s_version: "v1.31.5+k3s1"
    sonarqube_image: "sonarqube:lts-community"
    docker_apt_keyring: /etc/apt/keyrings/docker.asc

  tasks:
    - name: Install host prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - tar
        state: present
        update_cache: true

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: "{{ docker_apt_keyring }}"
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
          signed-by={{ docker_apt_keyring }}]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Configure kernel settings required by SonarQube
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop:
        - { name: "vm.max_map_count", value: "524288" }
        - { name: "fs.file-max", value: "131072" }

    - name: Download Gitleaks release
      ansible.builtin.get_url:
        url: "https://github.com/gitleaks/gitleaks/releases/download/v{{ gitleaks_version }}/gitleaks_{{ gitleaks_version }}_linux_{{ 'arm64' if ansible_architecture == 'aarch64' else 'x64' }}.tar.gz"
        dest: /tmp/gitleaks.tar.gz
        mode: "0644"

    - name: Install Gitleaks binary
      ansible.builtin.unarchive:
        src: /tmp/gitleaks.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include:
          - gitleaks
        mode: "0755"
        creates: /usr/local/bin/gitleaks

    - name: Allow the Ansible SSH user to access Docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Download K3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Install K3s
      ansible.builtin.command:
        argv:
          - /bin/sh
          - /tmp/k3s-install.sh
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"

    - name: Find Ansible user's home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Create kubeconfig directory for Ansible user
      ansible.builtin.file:
        path: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Install K3s kubeconfig for Ansible user
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Ensure SonarQube data directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      loop:
        - /opt/sonarqube/data
        - /opt/sonarqube/extensions
        - /opt/sonarqube/logs

    - name: Run SonarQube
      community.docker.docker_container:
        name: sonarqube
        image: "{{ sonarqube_image }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "9000:9000"
        volumes:
          - /opt/sonarqube/data:/opt/sonarqube/data
          - /opt/sonarqube/extensions:/opt/sonarqube/extensions
          - /opt/sonarqube/logs:/opt/sonarqube/logs
