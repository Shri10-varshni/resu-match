name: ResuMatch CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build, Scan, and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io

  deploy-local-k3s:
    name: Deploy to Local K3s
    needs: build-and-analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image and import into K3s
        run: |
          IMAGE_TAG="resumatch:${{ github.run_number }}"
          docker build -t "$IMAGE_TAG" .
          TMP_TAR=$(mktemp)
          trap 'rm -f "$TMP_TAR"' EXIT
          docker save --output "$TMP_TAR" "$IMAGE_TAG"
          sudo k3s ctr images import "$TMP_TAR"

      - name: Deploy to K3s
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/resumatch resumatch="resumatch:${{ github.run_number }}"
          kubectl rollout status deployment/resumatch --timeout=180s