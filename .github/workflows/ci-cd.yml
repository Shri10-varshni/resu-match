name: ResuMatch CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build, Scan, and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io

  deploy-to-aks:
    name: Push Image & Deploy to Azure AKS
    needs: build-and-analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shri10-varshni/resumatch:${{ github.run_number }}
            ghcr.io/shri10-varshni/resumatch:latest

      - name: Configure AKS kubectl
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG }}" | tr -d '\r\n ' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply Monitoring ConfigMaps
        run: |
          kubectl create configmap prometheus-config --from-file=monitoring/prometheus.yml --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap grafana-datasources --from-file=monitoring/grafana/provisioning/datasources/ --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap grafana-dashboards-prov --from-file=monitoring/grafana/provisioning/dashboards/ --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap grafana-dashboards --from-file=monitoring/grafana/dashboards/ --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Azure AKS
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/resumatch resumatch="ghcr.io/shri10-varshni/resumatch:${{ github.run_number }}"
          kubectl rollout status deployment/resumatch --timeout=300s