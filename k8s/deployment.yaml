apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumatch
  labels:
    app: resumatch
spec:
  replicas: 1 # Set to 2+ in cloud for high availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: resumatch
  template:
    metadata:
      labels:
        app: resumatch
    spec:
      containers:
        - name: resumatch
          # In cloud CI/CD, Jenkins will replace this with your registry tag (e.g., docker.io/user/resumatch:1.0)
          image: resumatch:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - AL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}